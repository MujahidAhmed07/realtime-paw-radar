<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PetAlert — real-time lost & found pet alerts. Report a missing pet and notify neighbors instantly." />
    <title>PetAlert — Real-Time Lost &amp; Found Pet Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore deep links arriving via the GitHub Pages 404 fallback.
      // %BASE_URL% is replaced by Vite with the configured base path, so the
      // restored URL keeps the repo prefix on GitHub Pages project sites.
      (function () {
        var params = new URLSearchParams(window.location.search)
        var p = params.get('path')
        if (p && p !== '/') {
          params.delete('path')
          var rest = params.toString()
          var base = '%BASE_URL%' // '/' or '/<repo>/'
          var path = base.replace(/\/$/, '') + p
          window.history.replaceState(null, '', path + (rest ? '?' + rest : ''))
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
