<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PetAlert</title>
    <script>
      // GitHub Pages SPA fallback. For project pages, the 404 page is served
      // from the domain root, so the repo prefix is recovered from the
      // document.referrer (the page that triggered the 404). Unknown paths
      // land on the app home.
      (function () {
        var l = window.location
        var prefix = ''
        try {
          var ref = document.referrer || ''
          var rm = ref.match(/^[a-z]+:\/\/[^/]+\/([^/]+)/)
          if (rm && rm[1] !== 'favicon.ico') prefix = '/' + rm[1]
        } catch (e) { /* ignore */ }
        var path = l.pathname.substring(prefix.length) || '/'
        l.replace(l.origin + prefix + '/?path=' + path + l.search)
      })()
    </script>
  </head>
  <body></body>
</html>
