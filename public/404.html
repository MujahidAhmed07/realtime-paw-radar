<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PetAlert</title>
    <script>
      // GitHub Pages SPA fallback (project pages). The repo prefix is injected
      // at build time by the inject-404-base Vite plugin (__PAGES_BASE__).
      // Unknown paths land on the app home.
      (function () {
        var l = window.location
        var prefix = '__PAGES_BASE__' // e.g. '/realtime-pet-finder/' or '' for root hosting
        var path = l.pathname.substring(prefix.length ? prefix.length - 1 : 0) || '/'
        l.replace(l.origin + prefix + '?path=' + path + l.search)
      })()
    </script>
  </head>
  <body></body>
</html>
